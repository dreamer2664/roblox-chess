name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4

      - name: Syntax check every Lua/Luau file
        run: |
          set -e
          for f in $(find src scripts tests -name '*.lua'); do
            luac5.4 -p "$f"
          done
          echo "all files parse"

      - name: Rules engine tests (perft + notation + draws)
        run: lua5.4 tests/run_tests.lua

      - name: Search tests + self play
        run: lua5.4 tests/run_ai_tests.lua

  renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 fonts-dejavu
      - run: pip install pillow numpy
      - name: Regenerate preview renders from the engine
        run: |
          lua5.4 scripts/dump_render_states.lua
          python3 tools/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders/*.png
